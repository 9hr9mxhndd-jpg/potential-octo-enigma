<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS ARCHIVE // 기록형 자기계발 목업</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a12;
      --bg2: #101322;
      --card: rgba(17, 20, 35, 0.88);
      --card-2: rgba(13, 16, 29, 0.9);
      --line: rgba(123, 106, 255, 0.18);
      --line-strong: rgba(0, 212, 255, 0.32);
      --text: #eef2ff;
      --muted: #98a2c6;
      --dim: #5e6687;
      --purple: #8c5cff;
      --cyan: #00d4ff;
      --green: #00f5b0;
      --yellow: #ffd84d;
      --red: #ff5f7b;
      --shadow-purple: 0 0 24px rgba(140, 92, 255, 0.26);
      --shadow-cyan: 0 0 24px rgba(0, 212, 255, 0.18);
      --radius: 18px;
      --mono: 'IBM Plex Mono', monospace;
      --display: 'Rajdhani', sans-serif;
      --body: 'Noto Sans KR', sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--body);
      background:
        radial-gradient(circle at 12% 18%, rgba(140,92,255,0.16), transparent 30%),
        radial-gradient(circle at 85% 10%, rgba(0,212,255,0.12), transparent 26%),
        linear-gradient(180deg, #0a0c15 0%, #07080f 100%);
      color: var(--text);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      opacity: .32;
    }

    .shell {
      max-width: 1460px;
      margin: 0 auto;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(10,12,22,0.8);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      position: sticky;
      top: 18px;
      z-index: 10;
    }
    .brand-title {
      font-family: var(--display);
      font-size: 34px;
      line-height: 1;
      letter-spacing: 4px;
      font-weight: 700;
    }
    .brand-title span { color: var(--purple); text-shadow: var(--shadow-purple); }
    .brand-sub {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 1px;
      margin-top: 6px;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .tab-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      transition: .22s ease;
    }
    .tab-btn:hover,
    .tab-btn.active {
      color: var(--text);
      border-color: rgba(140, 92, 255, .46);
      background: rgba(140, 92, 255, .13);
      box-shadow: var(--shadow-purple);
      transform: translateY(-1px);
    }

    .view { display: none; margin-top: 24px; }
    .view.active { display: block; }

    .page-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .eyebrow {
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .eyebrow::before {
      content: '';
      width: 30px;
      height: 1px;
      background: linear-gradient(90deg, var(--cyan), transparent);
    }
    h1, h2, h3, h4 { margin: 0; }
    .page-title {
      font-size: clamp(28px, 4vw, 44px);
      font-family: var(--display);
      letter-spacing: 1px;
    }
    .page-desc { color: var(--muted); max-width: 900px; line-height: 1.65; }

    .grid {
      display: grid;
      gap: 18px;
    }
    .dashboard-grid {
      grid-template-columns: 1.25fr .95fr;
    }
    .records-grid,
    .achievements-grid-main {
      grid-template-columns: 400px 1fr;
    }
    .analytics-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cards-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .cards-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .cards-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      background: linear-gradient(180deg, rgba(18,21,36,.96), rgba(12,14,26,.95));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 14px 30px rgba(0,0,0,.22);
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(140,92,255,.75), transparent);
      opacity: .6;
    }
    .card-title {
      font-family: var(--display);
      font-size: 24px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .card-sub {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .section-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--purple);
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, rgba(140,92,255,.5), transparent);
    }

    .hero {
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 18px;
      align-items: center;
      margin-bottom: 18px;
    }
    .avatar {
      width: 118px;
      height: 118px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      font-size: 56px;
      background: linear-gradient(135deg, rgba(140,92,255,.32), rgba(0,212,255,.22));
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: var(--shadow-cyan);
    }
    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .profile-name {
      font-family: var(--display);
      font-size: 34px;
      letter-spacing: 1px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }
    .pill.good { color: var(--green); border-color: rgba(0,245,176,.25); background: rgba(0,245,176,.06); }
    .pill.warn { color: var(--yellow); border-color: rgba(255,216,77,.25); background: rgba(255,216,77,.06); }
    .pill.cyan { color: var(--cyan); border-color: rgba(0,212,255,.25); background: rgba(0,212,255,.06); }

    .summary-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .metric {
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.025);
      border-radius: 16px;
      padding: 16px;
    }
    .metric-label {
      color: var(--dim);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .metric-value {
      font-family: var(--display);
      font-size: 30px;
      line-height: 1;
      letter-spacing: .5px;
    }
    .metric-note { color: var(--muted); font-size: 12px; margin-top: 6px; }

    .category-card {
      border: 1px solid rgba(255,255,255,.06);
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      border-radius: 18px;
      padding: 18px;
      position: relative;
    }
    .category-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }
    .category-icon {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      font-size: 24px;
      background: rgba(140,92,255,.14);
      border: 1px solid rgba(140,92,255,.24);
    }
    .category-name { font-size: 22px; font-family: var(--display); }
    .category-target { color: var(--muted); font-size: 13px; }
    .big-number {
      font-family: var(--display);
      font-size: 40px;
      line-height: 1;
      margin: 14px 0 6px;
    }
    .tiny-label { color: var(--dim); font-size: 12px; }

    .progress {
      width: 100%;
      height: 9px;
      background: rgba(255,255,255,.05);
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0 10px;
      border: 1px solid rgba(255,255,255,.05);
    }
    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      box-shadow: var(--shadow-purple);
    }
    .mini-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }
    .mini-cell {
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 12px;
      padding: 10px;
      background: rgba(255,255,255,.018);
    }
    .mini-cell strong {
      display: block;
      font-family: var(--display);
      font-size: 18px;
      margin-bottom: 2px;
    }
    .mini-cell span { font-size: 11px; color: var(--dim); }

    .feed-item,
    .record-row,
    .achievement-card,
    .bridge-chip,
    .insight-row,
    .proof-card,
    .metric-table .mrow {
      transition: .18s ease;
    }
    .feed-list { display: grid; gap: 10px; }
    .feed-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      border: 1px solid rgba(255,255,255,.05);
      background: rgba(255,255,255,.02);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
    }
    .feed-item:hover,
    .record-row:hover,
    .achievement-card:hover,
    .bridge-chip:hover,
    .insight-row:hover {
      transform: translateY(-1px);
      border-color: rgba(140,92,255,.36);
      background: rgba(140,92,255,.08);
    }
    .feed-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 20px;
      background: rgba(0,212,255,.1);
      border: 1px solid rgba(0,212,255,.18);
    }
    .feed-main strong,
    .record-row strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
    }
    .feed-main span,
    .record-row span,
    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .feed-value {
      font-family: var(--display);
      font-size: 26px;
      white-space: nowrap;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }
    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 14px;
      font: inherit;
      outline: none;
    }
    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: rgba(140,92,255,.52);
      box-shadow: 0 0 0 3px rgba(140,92,255,.12);
    }
    .textarea { min-height: 90px; resize: vertical; }
    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn-row { display: flex; gap: 10px; }
    .btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 16px;
      cursor: pointer;
      font-family: var(--mono);
      transition: .2s ease;
    }
    .btn.primary {
      background: linear-gradient(135deg, rgba(140,92,255,.92), rgba(76,130,255,.92));
      border-color: transparent;
      box-shadow: var(--shadow-purple);
    }
    .btn:hover { transform: translateY(-1px); }

    .records-toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .toolbar-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .record-list { display: grid; gap: 10px; max-height: 850px; overflow: auto; padding-right: 6px; }
    .record-row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 14px;
      align-items: center;
      border: 1px solid rgba(255,255,255,.05);
      background: rgba(255,255,255,.02);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
    }
    .record-date {
      border-right: 1px solid rgba(255,255,255,.07);
      padding-right: 12px;
      text-align: center;
    }
    .record-date b {
      display: block;
      font-family: var(--display);
      font-size: 24px;
    }
    .record-date small { color: var(--dim); font-family: var(--mono); }
    .record-value {
      text-align: right;
      font-family: var(--display);
      font-size: 24px;
      min-width: 110px;
    }

    .metric-table { display: grid; gap: 12px; }
    .metric-block {
      border: 1px solid rgba(255,255,255,.05);
      background: rgba(255,255,255,.02);
      border-radius: 18px;
      padding: 18px;
    }
    .metric-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .metric-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--display);
      font-size: 24px;
    }
    .mrow {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,.05);
      padding-top: 12px;
      margin-top: 12px;
    }
    .mcell {
      background: rgba(255,255,255,.018);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.05);
    }
    .mcell small {
      display: block;
      color: var(--dim);
      font-size: 11px;
      font-family: var(--mono);
      margin-bottom: 6px;
      letter-spacing: .5px;
    }
    .mcell strong {
      font-family: var(--display);
      font-size: 24px;
      display: block;
    }
    .mcell span { color: var(--muted); font-size: 12px; }

    .achievement-card {
      border: 1px solid rgba(255,255,255,.06);
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02));
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
    }
    .achievement-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }
    .achievement-emoji {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 24px;
      background: rgba(140,92,255,.13);
      border: 1px solid rgba(140,92,255,.22);
      flex: 0 0 auto;
    }
    .achievement-name {
      font-family: var(--display);
      font-size: 23px;
      line-height: 1;
      margin-bottom: 6px;
    }
    .achievement-desc { color: var(--muted); font-size: 13px; line-height: 1.6; min-height: 40px; }
    .achievement-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      margin-bottom: 12px;
    }
    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 11px;
      border: 1px solid rgba(255,255,255,.08);
      color: var(--muted);
    }
    .status-tag.unlocked {
      color: var(--green);
      border-color: rgba(0,245,176,.24);
      background: rgba(0,245,176,.06);
    }
    .rarity {
      font-size: 12px;
      color: var(--yellow);
      font-family: var(--mono);
    }

    .bridge-panel {
      border: 1px solid rgba(0,212,255,.18);
      background: linear-gradient(180deg, rgba(0,212,255,.06), rgba(255,255,255,.02));
    }
    .bridge-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .bridge-chip {
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.02);
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 13px;
      text-align: center;
      cursor: pointer;
    }
    .bridge-chip.done {
      border-color: rgba(0,245,176,.3);
      background: rgba(0,245,176,.08);
      color: var(--green);
      box-shadow: inset 0 0 0 1px rgba(0,245,176,.06);
    }
    .bridge-chip small {
      display: block;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 10px;
      margin-top: 5px;
    }

    .insight-list { display: grid; gap: 12px; }
    .insight-row {
      border: 1px solid rgba(255,255,255,.05);
      background: rgba(255,255,255,.02);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }

    .badge-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.05);
      background: rgba(255,255,255,.02);
      border-radius: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .modal-wrap {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 14, 0.76);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 40;
    }
    .modal-wrap.open { display: flex; }
    .modal {
      width: min(860px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: linear-gradient(180deg, rgba(17,20,35,.98), rgba(10,12,23,.98));
      border-radius: 24px;
      border: 1px solid rgba(140,92,255,.25);
      box-shadow: 0 24px 80px rgba(0,0,0,.45), var(--shadow-purple);
      padding: 26px;
    }
    .modal-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .close-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,.1);
      color: var(--muted);
      border-radius: 12px;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 18px;
    }
    .proof-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .proof-card {
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.03);
      border-radius: 18px;
      padding: 16px;
    }
    .proof-card:hover { border-color: rgba(0,212,255,.32); background: rgba(0,212,255,.06); }
    .proof-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      align-items: start;
    }
    .empty {
      border: 1px dashed rgba(255,255,255,.1);
      background: rgba(255,255,255,.015);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }
    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      background: rgba(10,14,24,.96);
      border: 1px solid rgba(0,245,176,.25);
      color: var(--green);
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
      font-family: var(--mono);
      font-size: 12px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: .24s ease;
      z-index: 60;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1180px) {

      let previousDate = null;

        const isConsecutive = previousDate && ((currentDate - previousDate) / (1000 * 60 * 60 * 24) === 1);
        if (hit) {

        longest = Math.max(longest, currentRun);
        previousDate = currentDate;

          cursor.setDate(cursor.getDate() - 1);
        } else {

      }

                  <button class="bridge-chip ${bridgeItem.crossed ? 'done' : ''}" data-bridge-name="${bridgeItem.name}">
                    ${bridgeItem.name}
                    <small>${bridgeItem.crossed ? shortDate(bridgeItem.crossedAt) : '미정복'}</small>
                  </button>
                `).join('')}
              </div>
            </div>
            <div class="card">
              <div class="section-label">milestones</div>
              <div class="insight-list">
                <div class="insight-row"><div><strong>서울 탐험가</strong><span class="muted">보행 가능 한강 다리 5개 정복</span></div><div class="pill ${bridge.count >= 5 ? 'good' : ''}">${bridge.count}/5</div></div>
                <div class="insight-row"><div><strong>한강의 수호자</strong><span class="muted">보행 가능 한강 다리 10개 정복</span></div><div class="pill ${bridge.count >= 10 ? 'good' : ''}">${bridge.count}/10</div></div>
                <div class="insight-row"><div><strong>한강의 지배자</strong><span class="muted">보행 가능 한강 다리 23개 모두 건너기</span></div><div class="pill ${bridge.count >= 23 ? 'good' : ''}">${bridge.count}/23</div></div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="section-label">achievement gallery</div>
            <div class="cards-3">
              ${achievements.map(achievement => renderAchievementCard(achievement)).join('')}
            </div>
          </div>
        </div>
      `;
      bindAchievementOpeners();
      document.querySelectorAll('.bridge-chip').forEach(btn => {
        btn.addEventListener('click', () => openBridgeModal(btn.dataset.bridgeName));
      });
    }

    function renderAchievementCard(achievement) {
      return `
        <div class="achievement-card" data-achievement-id="${achievement.id}">
          <div class="achievement-head">
            <div style="display:flex;gap:12px;align-items:start;">
              <div class="achievement-emoji">${achievement.emoji}</div>
              <div>
                <div class="achievement-name">${achievement.name}</div>
                <div class="achievement-desc">${achievement.description}</div>
              </div>
            </div>
          </div>
          <div class="achievement-meta">
            <span class="status-tag ${achievement.unlocked ? 'unlocked' : ''}">${achievement.unlocked ? 'UNLOCKED' : 'IN PROGRESS'}</span>
            <span class="rarity">${achievement.rarity}</span>
          </div>
          <div class="progress"><span style="width:${achievement.percent}%"></span></div>
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px;">
            <span class="muted">${formatNumber(achievement.progress)} / ${formatNumber(achievement.target)} ${achievement.unit}</span>
            <span class="pill ${achievement.unlocked ? 'good' : ''}">${achievement.unlockedAt ? formatDate(achievement.unlockedAt) : '달성 전'}</span>
          </div>
        </div>
      `;
    }

    function handleCategoryToggle() {
      const category = document.getElementById('category').value;
      document.getElementById('bridge-field').style.display = category === 'bridge' ? 'block' : 'none';
    }

    function handleAddRecord(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const formData = new FormData(form);
      const category = formData.get('category');
      const value = Number(formData.get('value'));
      const date = formData.get('date');
      const note = formData.get('note');
      const evidence = formData.get('evidence');
      const proofType = formData.get('proofType');
      const bridgeName = formData.get('bridgeName');
      if (!category || !date || Number.isNaN(value)) {
        showToast('카테고리, 날짜, 수치를 확인해주세요.');
        return;
      }
      if (category === 'bridge' && bridgeName) {
        const already = app.state.bridgeCollection.find(b => b.name === bridgeName && b.crossed);
        if (already) {
          showToast(`${bridgeName}는 이미 정복 처리되어 있습니다.`);
          return;
        }
      }
      const nextId = Math.max(0, ...app.state.records.map(r => r.id)) + 1;
      app.state.records.push({
        id: nextId,
        category,
        value,
        date,
        note,
        evidence,
        proofType,
        bridgeName: category === 'bridge' ? bridgeName : undefined
      });
      if (category === 'bridge' && bridgeName) {
        const bridge = app.state.bridgeCollection.find(b => b.name === bridgeName);
        if (bridge) {
          bridge.crossed = true;
          bridge.crossedAt = date;
          bridge.proof = evidence || note || '증거 입력됨';
        }
      }
      saveState();
      renderAll();
      form.reset();
      document.getElementById('date').value = '2026-03-26';
      showToast('기록이 저장되었습니다. 업적 진행도도 함께 반영됐습니다.');
    }

    function handleRecordFilter(event) {
      const value = event.target.value;
      const rows = document.querySelectorAll('#record-list .record-row');
      rows.forEach(row => {
        row.style.display = value === 'all' || row.dataset.category === value ? '' : 'none';
      });
    }

    function bindRecordOpeners() {
      document.querySelectorAll('[data-record-id]').forEach(node => {
        node.addEventListener('click', () => openRecordModal(Number(node.dataset.recordId)));
      });
    }
    function bindAchievementOpeners() {
      document.querySelectorAll('[data-achievement-id]').forEach(node => {
        node.addEventListener('click', () => openAchievementModal(node.dataset.achievementId));
      });
    }

    function openRecordModal(recordId) {
      const record = app.state.records.find(r => r.id === recordId);
      if (!record) return;
      const meta = getCategoryMeta(record.category);
      document.getElementById('modal').innerHTML = `
        <div class="modal-header">
          <div>
            <div class="eyebrow">record detail</div>
            <div class="page-title" style="font-size:36px;">${meta.label}${record.bridgeName ? ` · ${record.bridgeName}` : ''}</div>
            <p class="page-desc">이 로그는 업적 상세에서 증거 카드로 재사용됩니다.</p>
          </div>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="cards-2">
          <div class="proof-card">
            <div class="proof-head"><strong>기록 수치</strong><span class="pill cyan">${formatDate(record.date)}</span></div>
            <div class="big-number" style="margin-top:0;">${formatNumber(record.value)} ${record.category === 'bridge' ? '' : meta.unit}</div>
            <div class="muted">${record.note || '메모 없음'}</div>
          </div>
          <div class="proof-card">
            <div class="proof-head"><strong>증거</strong><span class="pill">${record.proofType || '미지정'}</span></div>
            <div style="font-size:16px;line-height:1.7;">${record.evidence || '증거 문구가 아직 없습니다.'}</div>
            <div class="muted" style="margin-top:10px;">이 영역은 실제 서비스에서는 이미지, 링크, 위치 정보, 센서 데이터 썸네일로 확장 가능합니다.</div>
          </div>
        </div>
      `;
      openModal();
    }

    function openAchievementModal(achievementId) {
      const achievement = getAchievements().find(a => a.id === achievementId);
      if (!achievement) return;
      const proofRecords = (achievement.proofRecordIds || [])
        .map(id => app.state.records.find(r => r.id === id))
        .filter(Boolean);

      const extraBlock = ['hangang_explorer','hangang_guardian','hangang_master'].includes(achievement.id)
        ? `
          <div class="card" style="padding:18px;margin-top:16px;">
            <div class="section-label">bridge collection status</div>
            <div class="bridge-grid">
              ${app.state.bridgeCollection.map(bridgeItem => `
                <div class="bridge-chip ${bridgeItem.crossed ? 'done' : ''}">
                  ${bridgeItem.name}
                  <small>${bridgeItem.crossed ? shortDate(bridgeItem.crossedAt) : '미정복'}</small>
                </div>
              `).join('')}
            </div>
          </div>
        ` : '';

      document.getElementById('modal').innerHTML = `
        <div class="modal-header">
          <div>
            <div class="eyebrow">achievement detail</div>
            <div class="page-title" style="font-size:38px;">${achievement.emoji} ${achievement.name}</div>
            <p class="page-desc">${achievement.description}</p>
          </div>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <div class="cards-3">
          <div class="proof-card">
            <div class="proof-head"><strong>진행도</strong><span class="pill cyan">${achievement.percent}%</span></div>
            <div class="big-number" style="margin-top:0;">${formatNumber(achievement.progress)} / ${formatNumber(achievement.target)}</div>
            <div class="muted">단위: ${achievement.unit}</div>
          </div>
          <div class="proof-card">
            <div class="proof-head"><strong>달성 상태</strong><span class="pill ${achievement.unlocked ? 'good' : ''}">${achievement.unlocked ? 'UNLOCKED' : 'LOCKED'}</span></div>
            <div style="font-size:18px;line-height:1.6;">${achievement.unlockedAt ? formatDate(achievement.unlockedAt) : '아직 달성 전'}</div>
            <div class="muted">달성일자는 업적 카드와 상세 페이지 모두에 노출됩니다.</div>
          </div>
          <div class="proof-card">
            <div class="proof-head"><strong>희귀도 / 분류</strong><span class="pill">${achievement.group}</span></div>
            <div style="font-size:18px;line-height:1.6;">${achievement.rarity}</div>
            <div class="muted">희귀도와 플레이버 텍스트를 함께 보여주는 진열장 UX를 반영했습니다.</div>
          </div>
        </div>

        <div style="margin-top:18px;">
          <div class="section-label">proof</div>
          ${proofRecords.length ? `
            <div class="proof-grid">
              ${proofRecords.map(record => {
                const meta = getCategoryMeta(record.category);
                return `
                  <div class="proof-card" onclick="openRecordModal(${record.id})">
                    <div class="proof-head">
                      <strong>${meta.label}${record.bridgeName ? ` · ${record.bridgeName}` : ''}</strong>
                      <span class="pill">${formatDate(record.date)}</span>
                    </div>
                    <div style="font-size:20px;font-family:var(--display);margin-bottom:8px;">${formatNumber(record.value)} ${record.category === 'bridge' ? '' : meta.unit}</div>
                    <div class="muted">${record.note || '메모 없음'}</div>
                    <div class="muted" style="margin-top:8px;">증거: ${record.evidence || '미입력'} · ${record.proofType || '타입 미지정'}</div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `<div class="empty">아직 잠금 상태이거나 연결된 증거 로그가 없습니다. 현재까지의 진행도만 표시됩니다.</div>`}
        </div>
        ${extraBlock}
      `;
      openModal();
    }

    function openBridgeModal(name) {
      const bridge = app.state.bridgeCollection.find(item => item.name === name);
      const record = app.state.records.find(r => r.category === 'bridge' && r.bridgeName === name);
      document.getElementById('modal').innerHTML = `
        <div class="modal-header">
          <div>
            <div class="eyebrow">bridge detail</div>
            <div class="page-title" style="font-size:38px;">🌉 ${name}</div>
            <p class="page-desc">집합형 업적 내부의 개별 수집 단위입니다. 다리별 달성 여부와 증거를 직접 확인할 수 있습니다.</p>
          </div>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="cards-2">
          <div class="proof-card">
            <div class="proof-head"><strong>정복 상태</strong><span class="pill ${bridge?.crossed ? 'good' : ''}">${bridge?.crossed ? 'CROSSED' : 'NOT YET'}</span></div>
            <div style="font-size:20px;line-height:1.7;">${bridge?.crossed ? `${formatDate(bridge.crossedAt)} 달성` : '아직 증거가 없습니다.'}</div>
            <div class="muted" style="margin-top:8px;">${bridge?.crossed ? '업적 카드와 동일한 날짜 정보가 연동됩니다.' : '기록 허브에서 bridge 카테고리로 추가하면 여기에 반영됩니다.'}</div>
          </div>
          <div class="proof-card">
            <div class="proof-head"><strong>증거</strong><span class="pill">${record?.proofType || '미입력'}</span></div>
            <div style="font-size:16px;line-height:1.7;">${record?.evidence || '증거 없음'}</div>
            <div class="muted" style="margin-top:8px;">${record?.note || '메모 없음'}</div>
          </div>
        </div>
      `;
      openModal();
    }

    function openModal() {
      document.getElementById('modal-wrap').classList.add('open');
    }
    function closeModal() {
      document.getElementById('modal-wrap').classList.remove('open');
    }
    document.getElementById('modal-wrap').addEventListener('click', (e) => {
      if (e.target.id === 'modal-wrap') closeModal();
    });

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function renderAll() {
      saveState();
      renderTabs();
      renderDashboard();
      renderRecordsView();
      renderAnalyticsView();
      renderAchievementsView();
      switchView(app.activeView);
    }

    renderAll();
    window.switchView = switchView;
    window.openRecordModal = openRecordModal;
    window.closeModal = closeModal;
  </script>
</body>
</html>
